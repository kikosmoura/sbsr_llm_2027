[metadata]
name = consultas-ambientais
version = 0.7.0
description = Contratos e diagnosticos verificaveis para consultas ambientais
long_description = file: README.md
long_description_content_type = text/markdown
license = Proprietary - research prototype; data licenses apply separately

[options]
package_dir =
    =src
packages = find:
python_requires = >=3.10
install_requires =
    pydantic==2.12.5
    requests==2.32.5
    typing-extensions==4.15.0

[options.packages.find]
where = src

[options.package_data]
consultas_ambientais =
    llm/prompts/pt_v1/*.txt
    llm/prompts/pt_v1/*.json
    llm/prompts/pt_v2/*.txt
    llm/prompts/pt_v2/*.json
    llm/prompts/pt_v3/*.txt
    llm/prompts/pt_v3/*.json
    evaluation/prompts/*.txt
    semantics/data/mapbiomas_col11_v1/*.json
    semantics/data/mapbiomas_col11_v1/sources/*

[options.extras_require]
diagnostics =
    psycopg2-binary==2.9.11
    rasterio==1.4.3
    numpy==2.2.6
processing =
    psycopg2-binary==2.9.11
    rasterio==1.4.3
    numpy==2.2.6
    shapely==2.1.2
    pyproj==3.3.0
    duckdb==1.4.1
    psutil==7.0.0
queries =
    duckdb==1.4.1
local =
    fastapi==0.135.1
    starlette==0.52.1
    uvicorn==0.42.0
    anyio==4.12.1
    python-dotenv==1.2.2
    duckdb==1.4.1
evaluation =
    duckdb==1.4.1
    numpy==2.2.6
    python-dotenv==1.2.2
test =
    pytest==7.4.4
    httpx==0.28.1

[options.entry_points]
console_scripts =
    consultas-ambientais = consultas_ambientais.cli:main
